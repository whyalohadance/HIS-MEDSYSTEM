# ============================================
# Docker Compose override — Hot Reload mode
# ============================================
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   or:  make hot
#
# What changes vs production:
#   - backend: Dockerfile.dev + src/ bind mount + npm run start:dev (NestJS watch)
#   - frontend: Dockerfile.dev + src/ bind mount + ng serve on port 4200
#   - postgres:  unchanged (uses base config)
# ============================================

services:

  # ─────────────────────────────────────────
  # Backend — NestJS watch mode
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: his-medsystem-backend:dev
    # Bind-mount source so edits are visible instantly
    volumes:
      - ./backend/src:/app/src
    command: npm run start:dev
    environment:
      NODE_ENV: development
    # More RAM for TypeScript compilation
    mem_limit: 2g
    cpus: 2

  # ─────────────────────────────────────────
  # Frontend — Angular dev server (ng serve)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: his-medsystem-frontend:dev
    # Bind-mount source so edits are visible instantly
    volumes:
      - ./frontend/src:/app/src
    # Expose Angular dev server on port 4200 (in addition to base 80)
    ports:
      - "4200:4200"
    command: npx ng serve --host 0.0.0.0 --poll 2000
    # More RAM for ng serve + incremental compilation
    mem_limit: 1g
    cpus: 1
