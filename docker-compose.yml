version: '3.8'

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: his_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-medical_db}
      POSTGRES_USER: ${DB_USERNAME:-medical_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medical123}
      TZ: Europe/Chisinau
      PGTZ: Europe/Chisinau
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-medical_user} -d ${DB_DATABASE:-medical_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: 1
    logging: *default-logging
    networks:
      - his_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-production}
    image: his-medsystem-backend:latest
    container_name: his_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      TZ: Europe/Chisinau
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-medical_user}
      DB_PASSWORD: ${DB_PASSWORD:-medical123}
      DB_DATABASE: ${DB_DATABASE:-medical_db}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      JWT_SECRET: ${JWT_SECRET:-medical_super_secret_key_2024}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      RUN_SEED: ${RUN_SEED:-true}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/uploads
      - dicom_data:/app/dicom
      - ./backend/fonts:/app/fonts:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 1g
    cpus: 1.5
    logging: *default-logging
    networks:
      - his_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: his-medsystem-frontend:latest
    container_name: his_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TZ: Europe/Chisinau
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 128m
    cpus: 0.5
    logging: *default-logging
    networks:
      - his_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: his_pgadmin
    restart: unless-stopped
    profiles: ["dev", "tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@his.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      TZ: Europe/Chisinau
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    mem_limit: 256m
    logging: *default-logging
    networks:
      - his_network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  dicom_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  his_network:
    driver: bridge
    name: his_network
